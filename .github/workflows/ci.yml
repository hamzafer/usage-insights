name: CI

on:
  pull_request:
  push:
    branches: [main, "integration/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
